spring.application.name=incident-platform
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/incidents}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:incident_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local_dev_password_change_me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
